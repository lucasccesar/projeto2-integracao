services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 12

  order-service:
    build:
      context: ./order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: demo
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  payment-provider:
    build:
      context: ./payment-provider
    environment:
      RECEIVER_URL: http://order-service:8081/webhooks/payments
    ports:
      - "8082:8082"

volumes:
  postgres_data:
